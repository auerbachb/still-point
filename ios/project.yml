name: StillPoint
options:
  bundleIdPrefix: com.brettonauerbach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  StillPointShared:
    path: StillPointShared

targets:
  StillPoint:
    type: application
    platform: iOS
    sources:
      - StillPointApp
    resources:
      - path: StillPointApp/Resources
        buildPhase: resources
    dependencies:
      - package: StillPointShared
    info:
      path: StillPointApp/Info.plist
      properties:
        UIAppFonts:
          - Fonts/Newsreader-Variable.ttf
          - Fonts/Newsreader-Italic-Variable.ttf
          - Fonts/JetBrainsMono-Variable.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: T5UU4BP6AV
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
