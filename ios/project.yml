name: StillPoint
options:
  bundleIdPrefix: com.brettonauerbach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

packages:
  StillPointShared:
    path: StillPointShared
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

targets:
  StillPoint:
    type: application
    platform: iOS
    sources:
      - StillPointApp
      - AppBlockingShared
    resources:
      - path: StillPointApp/Resources
        buildPhase: resources
    dependencies:
      - package: StillPointShared
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: StillPointMonitor
      - target: StillPointWidget
      - sdk: ARKit.framework
    info:
      path: StillPointApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        # Native Google Sign-In (#344). The iOS OAuth client ID + optional web
        # (server) client ID are injected from build settings so real client IDs
        # stay out of the committed plist; set GID_CLIENT_ID / GID_SERVER_CLIENT_ID /
        # GID_REVERSED_CLIENT_ID per environment. The reversed client ID is the
        # OAuth redirect URL scheme the GoogleSignIn SDK listens on.
        GIDClientID: $(GID_CLIENT_ID)
        GIDServerClientID: $(GID_SERVER_CLIENT_ID)
        # Custom URL scheme (stillpoint://) for deep links: daily-reminder push taps,
        # buddy invites (stillpoint://buddy/...), and session links. See AppViewModel /
        # RootView.onOpenURL / PushNotificationCoordinator. The second entry is the
        # Google Sign-In OAuth callback (reversed iOS client ID).
        CFBundleURLTypes:
          - CFBundleURLName: com.brettonauerbach.stillpoint
            CFBundleURLSchemes:
              - stillpoint
          - CFBundleURLName: com.brettonauerbach.stillpoint.googlesignin
            CFBundleURLSchemes:
              - $(GID_REVERSED_CLIENT_ID)
        # Privacy purpose strings — REQUIRED by iOS for the buddy video web view
        # (BuddyVideoWebView: WKWebView -> Daily.co getUserMedia). A missing key is a
        # hard crash the moment camera/mic is requested, not a graceful denial.
        NSCameraUsageDescription: Still Point uses the camera for partner video sessions and, when you opt in, gaze attention tracking during sits.
        NSMicrophoneUsageDescription: Still Point needs microphone access for partner video sessions.
        # NSFamilyControlsUsageDescription is intentionally NOT declared: it is not a
        # recognized iOS key. FamilyControls / Screen Time authorization is gated by the
        # com.apple.developer.family-controls entitlement (StillPointApp/StillPoint.entitlements),
        # and the authorization dialog text cannot be customized via Info.plist. See #432.

        # Keep audio alive when the app is backgrounded mid-session.
        # fetch: required for BGAppRefreshTask (#549 / CodeAnt).
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.brettonauerbach.stillpoint.app-block-refresh
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 15
        # Native Google Sign-In client IDs (#344). Empty by default so no real
        # client ID is committed; override per environment / in CI signing config.
        # GID_CLIENT_ID:           iOS OAuth client ID (xxxxx.apps.googleusercontent.com)
        # GID_SERVER_CLIENT_ID:    web/server OAuth client ID (= AUTH_GOOGLE_ID), optional
        # GID_REVERSED_CLIENT_ID:  reversed iOS client ID URL scheme (com.googleusercontent.apps.xxxxx)
        GID_CLIENT_ID: ""
        GID_SERVER_CLIENT_ID: ""
        GID_REVERSED_CLIENT_ID: ""
        DEVELOPMENT_TEAM: T5UU4BP6AV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: StillPointApp/StillPoint.entitlements
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: StillPointApp/StillPointApp.entitlements
        # Device (archive) signing: manual, with this target's own App Store profile.
        # Simulator/e2e keeps Automatic via the base CODE_SIGN_STYLE above — these keys
        # are sdk-gated to iphoneos so they never affect the simulator test build.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Manual
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: "StillPoint App Store"

  StillPointMonitor:
    type: app-extension
    platform: iOS
    sources:
      - StillPointMonitor
      - AppBlockingShared
    info:
      path: StillPointMonitor/Info.plist
      properties:
        CFBundleDisplayName: Still Point Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).StillPointMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint.monitor
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 15
        DEVELOPMENT_TEAM: T5UU4BP6AV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: StillPointMonitor/StillPointMonitor.entitlements
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        # Device (archive) signing for the embedded extension — its own App Store profile.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Manual
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: "StillPoint Monitor App Store"

  StillPointWidget:
    type: app-extension
    platform: iOS
    sources:
      - StillPointWidget
    dependencies:
      - package: StillPointShared
    info:
      path: StillPointWidget/Info.plist
      properties:
        CFBundleDisplayName: Still Point Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint.widget
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 15
        DEVELOPMENT_TEAM: T5UU4BP6AV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: StillPointWidget/StillPointWidget.entitlements
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        # Device (archive) signing for the embedded widget extension — its own App Store profile.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Manual
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: "StillPoint Widget App Store"

  StillPointAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StillPointAppUITests
    dependencies:
      - target: StillPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
