name: StillPoint
options:
  bundleIdPrefix: com.brettonauerbach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

packages:
  StillPointShared:
    path: StillPointShared

targets:
  StillPoint:
    type: application
    platform: iOS
    sources:
      - StillPointApp
      - AppBlockingShared
    resources:
      - path: StillPointApp/Resources
        buildPhase: resources
    dependencies:
      - package: StillPointShared
      - target: StillPointMonitor
    info:
      path: StillPointApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Fonts/Newsreader-Variable.ttf
          - Fonts/Newsreader-Italic-Variable.ttf
          - Fonts/JetBrainsMono-Variable.ttf
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        # Custom URL scheme (stillpoint://) for deep links: daily-reminder push taps,
        # buddy invites (stillpoint://buddy/...), and session links. See AppViewModel /
        # RootView.onOpenURL / PushNotificationCoordinator.
        CFBundleURLTypes:
          - CFBundleURLName: com.brettonauerbach.stillpoint
            CFBundleURLSchemes:
              - stillpoint
        # Privacy purpose strings — REQUIRED by iOS for the buddy video web view
        # (BuddyVideoWebView: WKWebView -> Daily.co getUserMedia). A missing key is a
        # hard crash the moment camera/mic is requested, not a graceful denial.
        NSCameraUsageDescription: Still Point needs camera access for partner video sessions.
        NSMicrophoneUsageDescription: Still Point needs microphone access for partner video sessions.
        # NSFamilyControlsUsageDescription is intentionally NOT declared: it is not a
        # recognized iOS key. FamilyControls / Screen Time authorization is gated by the
        # com.apple.developer.family-controls entitlement (StillPointApp/StillPoint.entitlements),
        # and the authorization dialog text cannot be customized via Info.plist. See #432.

        # Keep audio alive when the app is backgrounded mid-session.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 13
        DEVELOPMENT_TEAM: T5UU4BP6AV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: StillPointApp/StillPoint.entitlements
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: StillPointApp/StillPointApp.entitlements
        # Device (archive) signing: manual, with this target's own App Store profile.
        # Simulator/e2e keeps Automatic via the base CODE_SIGN_STYLE above — these keys
        # are sdk-gated to iphoneos so they never affect the simulator test build.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Manual
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: "StillPoint App Store"

  StillPointMonitor:
    type: app-extension
    platform: iOS
    sources:
      - StillPointMonitor
      - AppBlockingShared
    info:
      path: StillPointMonitor/Info.plist
      properties:
        CFBundleDisplayName: Still Point Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).StillPointMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint.monitor
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 13
        DEVELOPMENT_TEAM: T5UU4BP6AV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: StillPointMonitor/StillPointMonitor.entitlements
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        # Device (archive) signing for the embedded extension — its own App Store profile.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Manual
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: "StillPoint Monitor App Store"

  StillPointAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StillPointAppUITests
    dependencies:
      - target: StillPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
