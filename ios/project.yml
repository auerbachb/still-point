name: StillPoint
options:
  bundleIdPrefix: com.brettonauerbach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

packages:
  StillPointShared:
    path: StillPointShared

targets:
  StillPoint:
    type: application
    platform: iOS
    sources:
      - StillPointApp
    resources:
      - path: StillPointApp/Resources
        buildPhase: resources
    dependencies:
      - package: StillPointShared
    info:
      path: StillPointApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Fonts/Newsreader-Variable.ttf
          - Fonts/Newsreader-Italic-Variable.ttf
          - Fonts/JetBrainsMono-Variable.ttf
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 9
        DEVELOPMENT_TEAM: T5UU4BP6AV
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  StillPointAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StillPointAppUITests
    dependencies:
      - target: StillPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettonauerbach.stillpoint.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
