name: Install XcodeGen and generate the Xcode project
description: >-
  Installs XcodeGen with Homebrew, retrying transient failures, then runs
  `xcodegen generate` in ios/. Shared by the TestFlight and App Store release
  lanes (#1113), the iOS E2E lanes, and the Info.plist sync check (#1137).

runs:
  using: composite
  steps:
    - name: Install XcodeGen (retry on transient Homebrew failures)
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if brew install xcodegen; then
            exit 0
          fi
          if [[ "$attempt" -lt 3 ]]; then
            sleep $((attempt * 10))
          fi
        done
        echo "Failed to install xcodegen after 3 attempts."
        exit 1

    - name: Generate Xcode project
      working-directory: ios
      shell: bash
      run: xcodegen generate
