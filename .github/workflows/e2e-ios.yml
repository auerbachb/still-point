name: E2E iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "docs/testing/e2e-policy.md"
      - ".github/workflows/e2e-ios.yml"
      - "scripts/e2e/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  ios-e2e-smoke:
    name: ios-e2e-smoke
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS smoke lane
        env:
          E2E_ENV: ci
          E2E_BASE_URL: "http://127.0.0.1:3000"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_SECRETS_REQUIRED: "true"
        run: npm run e2e:ios:smoke

      - name: Record iOS perf metric (report-only)
        if: always()
        env:
          IOS_E2E_APP_BOOT_SECONDS: ${{ vars.IOS_E2E_APP_BOOT_SECONDS }}
        run: npm run e2e:ios:perf

      - name: Upload iOS E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-smoke-artifacts
          path: artifacts/e2e/ios/**
          if-no-files-found: warn
          retention-days: 14

  ios-e2e-critical:
    name: ios-e2e-critical
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS critical lane
        env:
          E2E_ENV: ci
          E2E_BASE_URL: "http://127.0.0.1:3000"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_SECRETS_REQUIRED: "true"
        run: npm run e2e:ios:critical

      - name: Record iOS perf metric (report-only)
        if: always()
        env:
          IOS_E2E_APP_BOOT_SECONDS: ${{ vars.IOS_E2E_APP_BOOT_SECONDS }}
        run: npm run e2e:ios:perf

      - name: Upload iOS E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-critical-artifacts
          path: artifacts/e2e/ios/**
          if-no-files-found: warn
          retention-days: 14
