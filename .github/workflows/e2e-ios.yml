name: E2E iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "docs/testing/e2e-policy.md"
      - ".github/workflows/e2e-ios.yml"
      - "scripts/e2e/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  ios-e2e:
    name: ios-e2e-${{ matrix.lane }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [smoke, critical]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # iOS UITest retries are controlled by `scripts/e2e/run-ios-tests.sh` (2nd arg =
      # MAX_RETRIES). `package.json` passes `1` for both smoke and critical (`e2e:ios:*`),
      # so each lane runs a single xcodebuild attempt unless that script is changed.
      - name: Run iOS ${{ matrix.lane }} lane
        env:
          E2E_ENV: ci
          E2E_BASE_URL: "http://127.0.0.1:3000"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_SECRETS_REQUIRED: "false"
        run: npm run e2e:ios:${{ matrix.lane }}

      - name: Export iOS E2E diagnostics
        if: always()
        run: |
          mkdir -p artifacts/e2e/ios
          log show --last 30m \
            --predicate '(subsystem == "com.brettonauerbach.stillpoint" AND category == "e2e-diag") OR eventMessage CONTAINS "[E2E-DIAG]"' \
            --style compact > "artifacts/e2e/ios/${{ matrix.lane }}-e2e-diag.log" || true

      - name: Record iOS perf metric (report-only)
        if: always()
        env:
          # Baseline placeholder when no harness-provided metric is wired yet.
          IOS_E2E_APP_BOOT_SECONDS: ${{ vars.IOS_E2E_APP_BOOT_SECONDS || '4.2' }}
        run: npm run e2e:ios:perf

      - name: Upload iOS E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-ios-${{ matrix.lane }}-artifacts
          path: artifacts/e2e/ios/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-ios-${{ matrix.lane }}-diagreports
          path: ~/Library/Logs/DiagnosticReports/**
          if-no-files-found: ignore
          retention-days: 14

  # Guards against project.yml <-> Info.plist drift. CI regenerates Info.plist via
  # `xcodegen generate` before every build, so any key that lives only in the committed
  # Info.plist (and not in project.yml's info.properties) is silently dropped from
  # shipped builds. This job fails the PR if regeneration would change the committed
  # Info.plist, forcing project.yml to stay the single source of truth. See issue #432.
  infoplist-sync:
    name: Info.plist in sync with project.yml
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Verify committed Info.plist matches XcodeGen output
        run: |
          if ! git diff --exit-code -- ios/StillPointApp/Info.plist; then
            echo "::error::ios/StillPointApp/Info.plist is out of sync with ios/project.yml."
            echo "CI regenerates Info.plist via 'xcodegen generate' before every build, so any key that"
            echo "exists only in the committed Info.plist (not in project.yml info.properties) is DROPPED"
            echo "from shipped builds. Fix: add the key(s) to ios/project.yml -> targets.StillPoint.info.properties,"
            echo "then run 'cd ios && xcodegen generate' and commit the regenerated ios/StillPointApp/Info.plist."
            exit 1
          fi
