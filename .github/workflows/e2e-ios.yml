name: E2E iOS

# As of #588 (SkinGod model), this workflow NO LONGER runs on `pull_request`.
# Native iOS e2e (macOS XCTest smoke/critical) gates the TestFlight release path
# via `ios-testflight-auto.yml` instead of blocking every PR. The Info.plist
# sync guard moved to `infoplist-sync.yml` (required on every PR — #439/#588).
#
# Runs via:
#   - `ios-testflight-auto.yml` — release:ios merge gate (#588)
#   - `workflow_dispatch` — ad-hoc verification
#   - `workflow_call` — reusable from other workflows
#
# Mirrors auerbachb/skingod#1402 / still-point #494 (mobile-web off PRs).

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit ref (SHA, branch, or tag) to check out and test"
        type: string
        required: true
    secrets:
      E2E_TEST_USER_EMAIL:
        required: false
      E2E_TEST_USER_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ref to test. Defaults to the ref this run was dispatched from."
        type: string
        required: false

permissions:
  contents: read

jobs:
  ios-e2e:
    name: ios-e2e-${{ matrix.lane }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [smoke, critical]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # iOS UITest retries are controlled by `scripts/e2e/run-ios-tests.sh` (2nd arg =
      # MAX_RETRIES). `package.json` passes `1` for both smoke and critical (`e2e:ios:*`),
      # so each lane runs a single xcodebuild attempt unless that script is changed.
      - name: Run iOS ${{ matrix.lane }} lane
        env:
          E2E_ENV: ci
          E2E_BASE_URL: "http://127.0.0.1:3000"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_SECRETS_REQUIRED: "false"
        run: npm run e2e:ios:${{ matrix.lane }}

      - name: Export iOS E2E diagnostics
        if: always()
        run: |
          mkdir -p artifacts/e2e/ios
          log show --last 30m \
            --predicate '(subsystem == "com.brettonauerbach.stillpoint" AND category == "e2e-diag") OR eventMessage CONTAINS "[E2E-DIAG]"' \
            --style compact > "artifacts/e2e/ios/${{ matrix.lane }}-e2e-diag.log" || true

      - name: Record iOS perf metric (report-only)
        if: always()
        env:
          # Baseline placeholder when no harness-provided metric is wired yet.
          IOS_E2E_APP_BOOT_SECONDS: ${{ vars.IOS_E2E_APP_BOOT_SECONDS || '4.2' }}
        run: npm run e2e:ios:perf

      - name: Upload iOS E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios-${{ matrix.lane }}-artifacts
          path: artifacts/e2e/ios/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios-${{ matrix.lane }}-diagreports
          path: ~/Library/Logs/DiagnosticReports/**
          if-no-files-found: ignore
          retention-days: 14
