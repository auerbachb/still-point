name: E2E Mobile Web

# Reusable mobile-web Playwright suite. As of #494, this NO LONGER runs on
# `pull_request` — it was the slowest, flakiest per-PR check (3-project matrix,
# no path filter) and blocked PRs that couldn't affect mobile web at all. It
# now runs ONLY:
#   - as part of the release pipeline — `ios-testflight-auto.yml` calls it via
#     `workflow_call` and gates the build-number bump + TestFlight build on a
#     green run;
#   - on demand via `workflow_dispatch` for ad-hoc verification.
# The manual `ios-v*-build*` tag path (`ios-testflight.yml`) intentionally does
# NOT call this workflow — it's the break-glass escape hatch for shipping when
# e2e infra itself is down. Mirrors auerbachb/skingod#1402.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit ref (SHA, branch, or tag) to check out and test"
        type: string
        required: true
    # These MUST stay `required: false`. The only caller (ios-testflight-auto.yml)
    # passes `secrets: inherit`, and the repo does not define POSTGRES_URL /
    # E2E_WEB_EMAIL / E2E_WEB_PASSWORD — marking a secret the caller can't supply
    # as `required: true` fails the whole workflow_call at startup (no runner,
    # ~2s), which silently blocked every release:ios auto-build. e2e/global-setup.ts
    # already skips DB provisioning and runs the mobile suite in mock mode when
    # these are empty, so absent secrets are expected, not an error.
    secrets:
      POSTGRES_URL:
        required: false
      E2E_WEB_EMAIL:
        required: false
      E2E_WEB_PASSWORD:
        required: false
      E2E_TEST_USER_EMAIL:
        required: false
      E2E_TEST_USER_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ref (SHA, branch, or tag) to check out and test. Defaults to the ref this run was dispatched from."
        type: string
        required: false

jobs:
  e2e-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_WEB_SETUP_USER: "true"
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      E2E_WEB_EMAIL: ${{ secrets.E2E_WEB_EMAIL }}
      E2E_WEB_PASSWORD: ${{ secrets.E2E_WEB_PASSWORD }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-chromium-narrow
          - mobile-chromium-wide
          - mobile-webkit-iphone
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile e2e project
        run: npx playwright test --project ${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
