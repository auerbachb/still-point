name: iOS App Compile

# The `StillPointApp compile` job is a REQUIRED status check on `main` once an
# admin applies `scripts/ci/sync-main-required-checks.mjs` (issue #698), so it
# must report a result on every PR. The real `xcodebuild` runs on macOS only
# when sources the `StillPoint` scheme compiles, `ios/project.yml`, or this
# workflow changed; otherwise a cheap ubuntu no-op still satisfies the check. Same shape as
# ios-shared-tests.yml (#463) and infoplist-sync.yml (#588).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect StillPointApp changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Detect changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Fail safe toward MORE coverage: if we can't determine the diff
          # (workflow_dispatch, or a transient API error), run the real compile.
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paginated files API — `gh pr view --json files` caps the list
          # (~100 files). Include previous_filename so a rename out of
          # StillPointApp still counts. GitHub also caps this endpoint at
          # 3000 files; a list that large may be truncated, so compile.
          # Do not use `grep -q` here: with `pipefail` it can close the pipe
          # early and report a real match as a miss.
          if ! files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"; then
            echo "Could not list pull request files; compiling to fail safe."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$files" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file_lines="$(printf '%s\n' "$files" | grep -c . || true)"
          if [ "${file_lines:-0}" -ge 3000 ]; then
            echo "Pull request file list reached the 3000-file API cap; compiling to fail safe."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The `StillPoint` scheme also compiles AppBlockingShared, the
          # StillPointMonitor and StillPointWidget extensions, and the
          # StillPointShared package, so a change to any of them can break
          # the app build.
          if printf '%s\n' "$files" | grep -E '^(ios/(StillPointApp|AppBlockingShared|StillPointMonitor|StillPointWidget|StillPointShared)/|ios/project\.yml$|\.github/workflows/ios-app-build\.yml$)' >/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  app-compile:
    name: StillPointApp compile
    needs: changes
    # macOS only when we actually compile; a cheap ubuntu runner for the
    # no-op pass so web-only PRs don't burn macOS minutes.
    runs-on: ${{ needs.changes.outputs.app == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install XcodeGen
        if: needs.changes.outputs.app == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        if: needs.changes.outputs.app == 'true'
        working-directory: ios
        run: xcodegen generate

      # Scheme `StillPoint` is the XcodeGen application target whose sources
      # are `ios/StillPointApp`. Simulator builds keep the base
      # CODE_SIGN_STYLE Automatic; iphoneos manual signing does not apply, so
      # this step passes no signing overrides (issue #698).
      - name: Compile StillPoint app target
        if: needs.changes.outputs.app == 'true'
        run: |
          set -euo pipefail
          # Same preferred-device resolution as scripts/e2e/run-ios-tests.sh
          # (resolve_test_destination). Keep the lists aligned so a retired
          # simulator name on macos-26 does not fail the compile.
          simctl_output="$(xcrun simctl list devices available 2>/dev/null || true)"
          destination=""
          preferred=(
            "iPhone 17 Pro"
            "iPhone 17"
            "iPhone 17 Pro Max"
            "iPhone 17e"
            "iPhone 16e"
            "iPhone 16 Pro"
            "iPhone 16"
            "iPhone 15 Pro"
            "iPhone 15"
            "iPhone Air"
          )
          for name in "${preferred[@]}"; do
            if grep -F "    ${name} (" <<<"${simctl_output}" >/dev/null 2>&1; then
              destination="platform=iOS Simulator,name=${name},OS=latest"
              break
            fi
          done
          if [ -z "$destination" ]; then
            destination="platform=iOS Simulator,name=iPhone 17,OS=latest"
          fi
          echo "Using iOS compile destination: ${destination}"
          xcodebuild build \
            -project ios/StillPoint.xcodeproj \
            -scheme StillPoint \
            -configuration Debug \
            -destination "${destination}"

      # No-op pass for PRs that don't touch the app target: keeps the required
      # "StillPointApp compile" check green without macOS minutes (issue #698).
      - name: Skip (StillPointApp unchanged)
        if: needs.changes.outputs.app != 'true'
        run: 'echo "StillPointApp unchanged on this PR — required check satisfied without compiling the app target (issue #698)."'
