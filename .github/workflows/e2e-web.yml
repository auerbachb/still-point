name: E2E Web

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-policy:
    name: e2e-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E policy checks
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e:policy

  web-e2e-smoke:
    name: web-e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-policy
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_WORKERS: "1"
      E2E_REPEAT_EACH: "1"
      E2E_RUN_ID: ${{ github.run_id }}
      SEED_CONFIRM: still-point-nonprod
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run web smoke lane
        run: npm run e2e:web:smoke

      - name: Upload web smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-smoke-artifacts
          path: |
            artifacts/e2e/web/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14

  web-e2e-critical:
    name: web-e2e-critical
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: e2e-policy
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_WORKERS: "1"
      E2E_REPEAT_EACH: "1"
      E2E_RUN_ID: ${{ github.run_id }}
      SEED_CONFIRM: still-point-nonprod
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run web critical lane
        run: npm run e2e:web:critical

      # Baseline placeholders until lane instrumentation emits real values:
      # E2E_WEB_FIRST_RESPONSE_MS / E2E_WEB_FIRST_RESPONSE_THRESHOLD_MS.
      # With E2E_WEB_PERF_ENFORCE=false this step remains report-only.
      - name: Record web performance metric (report-only by default)
        env:
          E2E_WEB_FIRST_RESPONSE_MS: "800"
          E2E_WEB_FIRST_RESPONSE_THRESHOLD_MS: "1200"
          E2E_WEB_PERF_ENFORCE: "false"
        run: npm run e2e:web:perf

      - name: Upload web critical artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-critical-artifacts
          path: |
            artifacts/e2e/web/**
            artifacts/e2e/perf/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14

  web-e2e-auth-db:
    name: web-e2e-auth-db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-policy
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_WORKERS: "1"
      E2E_REPEAT_EACH: "1"
      E2E_RUN_ID: ${{ github.run_id }}
      SEED_CONFIRM: still-point-nonprod
      POSTGRES_URL: ${{ secrets.E2E_AUTH_DB_POSTGRES_URL }}
      JWT_SECRET: ${{ secrets.E2E_AUTH_DB_JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check auth DB secrets
        id: authdb
        run: |
          # Trim so whitespace-only secrets skip (matches run-auth-db-integration.mjs).
          POSTGRES_TRIMMED="$(echo -n "${POSTGRES_URL}" | xargs)"
          JWT_TRIMMED="$(echo -n "${JWT_SECRET}" | xargs)"
          if [ -z "${POSTGRES_TRIMMED}" ] || [ -z "${JWT_TRIMMED}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping web-e2e-auth-db: set E2E_AUTH_DB_POSTGRES_URL and E2E_AUTH_DB_JWT_SECRET (see e2e/README.md)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.authdb.outputs.configured == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.authdb.outputs.configured == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.authdb.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run auth DB integration lane
        if: steps.authdb.outputs.configured == 'true'
        run: npm run e2e:web:authDb

      - name: Upload auth DB integration artifacts
        if: always() && steps.authdb.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-auth-db-artifacts
          path: |
            artifacts/e2e/web/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
