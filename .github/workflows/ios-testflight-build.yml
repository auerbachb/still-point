name: Build & Upload to TestFlight (reusable)

# Reusable workflow: builds Still Point in Release configuration and uploads it
# to App Store Connect / TestFlight. Single source of truth for the build +
# upload logic, called by:
#   - ios-testflight.yml      (manual ios-v*-build* tag push — escape hatch)
#   - ios-testflight-auto.yml (PR merged to main with the release:ios label)
#
# The heavy App Store release gates (PARITY/QA checklists, App Store dry-run
# evidence) are intentionally NOT here: TestFlight IS the testing surface, so
# gating it on a completed QA pass is circular. Those gates still guard the
# App Store release path in ios-app-store-release.yml (untouched). The cheap
# Release-config UI smoke gate is kept — it catches build-broken-on-Release
# before a slot is burned.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit ref (SHA or tag) to build from"
        type: string
        required: true
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: true
      BUILD_PROVISION_PROFILE_BASE64:
        required: true
      BUILD_PROVISION_PROFILE_EXTENSION_BASE64:
        required: true
      BUILD_PROVISION_PROFILE_WIDGET_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      APPSTORE_API_KEY_ID:
        required: true
      APPSTORE_API_ISSUER_ID:
        required: true
      APPSTORE_API_PRIVATE_KEY:
        required: true
      # Native Google Sign-In client IDs (#344 / #471). Optional so the build still
      # runs without them, but TestFlight build 14 shipped with these UNSET, leaving
      # the iOS Google client IDs empty in the archive — `GoogleSignInController.signIn()`
      # then threw `.notConfigured` before any token reached `/api/auth/google-native`
      # (matching the near-zero backend traffic in the #471 diagnostic). They are injected
      # into the archive build below so the shipped binary actually has the iOS OAuth
      # client ID + reversed-client-ID URL scheme. The empty defaults in ios/project.yml
      # stay unchanged so no real client ID is committed.
      GID_CLIENT_ID:
        required: false
      GID_REVERSED_CLIENT_ID:
        required: false
      GID_SERVER_CLIENT_ID:
        required: false

permissions:
  contents: read

jobs:
  pre-flight-tests:
    name: Release-config UI smoke gate
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS smoke lane in Release configuration
        # iOS UI tests run fully in-app via SP_UI_TEST_MODE=1 (set in
        # StillPointAppUITests.makeApp); no real backend is reached, so
        # we deliberately omit E2E_BASE_URL and credentials here.
        env:
          E2E_ENV: ci
          E2E_SECRETS_REQUIRED: "false"
          IOS_TEST_CONFIGURATION: "Release"
        run: npm run e2e:ios:smoke

      - name: Upload simulator diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-testflight-preflight-diagreports
          path: ~/Library/Logs/DiagnosticReports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-testflight-preflight-xcresult
          path: artifacts/e2e/ios/**
          if-no-files-found: warn
          retention-days: 14

  build-and-upload:
    needs: pre-flight-tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify Xcode and iOS SDK versions
        shell: bash
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: ${SDK_VERSION}"
          [[ "${SDK_VERSION%%.*}" -ge 26 ]]

      - name: Install XcodeGen (retry on transient Homebrew failures)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if brew install xcodegen; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "Failed to install xcodegen after 3 attempts."
          exit 1

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Apple certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_EXTENSION_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_EXTENSION_BASE64 }}
          BUILD_PROVISION_PROFILE_WIDGET_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_WIDGET_BASE64 }}
        run: |
          # Create variables
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          EXT_PP_PATH="$RUNNER_TEMP/build_pp_ext.mobileprovision"
          WIDGET_PP_PATH="$RUNNER_TEMP/build_pp_widget.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          # Import certificate and all three provisioning profiles (app + monitor + widget extensions)
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_EXTENSION_BASE64" | base64 --decode -o "$EXT_PP_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_WIDGET_BASE64" | base64 --decode -o "$WIDGET_PP_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Word-splitting on the existing-keychains list is intentional: each path
          # must reach -s as its own argument so the new keychain is appended, not
          # made the sole search-list entry.
          # shellcheck disable=SC2046
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Install all three provisioning profiles by UUID. The app and the embedded
          # StillPointMonitor and StillPointWidget extensions each sign with their own
          # profile, selected per-target via PROVISIONING_PROFILE_SPECIFIER in ios/project.yml.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(/usr/bin/security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${PP_UUID}".mobileprovision
          EXT_PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(/usr/bin/security cms -D -i "$EXT_PP_PATH")")
          cp "$EXT_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${EXT_PP_UUID}".mobileprovision
          WIDGET_PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(/usr/bin/security cms -D -i "$WIDGET_PP_PATH")")
          cp "$WIDGET_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${WIDGET_PP_UUID}".mobileprovision
          # Export the installed UUIDs so the always()-cleanup step removes the
          # actual UUID-named files (not the raw build_pp names).
          echo "PP_UUID=${PP_UUID}" >> "$GITHUB_ENV"
          echo "EXT_PP_UUID=${EXT_PP_UUID}" >> "$GITHUB_ENV"
          echo "WIDGET_PP_UUID=${WIDGET_PP_UUID}" >> "$GITHUB_ENV"

      - name: Build archive
        working-directory: ios
        env:
          # Native Google Sign-In client IDs (#344 / #471). Injected from CI secrets so
          # the archive's Info.plist (GIDClientID, GIDServerClientID, and the reversed-
          # client-ID URL scheme) is populated; the committed ios/project.yml keeps these
          # empty so no real client ID is checked in. A TestFlight archive REQUIRES both
          # GID_CLIENT_ID and GID_REVERSED_CLIENT_ID — the step below hard-fails when either
          # is missing rather than reship the #471 regression (build 14 had Google off).
          GID_CLIENT_ID: ${{ secrets.GID_CLIENT_ID }}
          GID_REVERSED_CLIENT_ID: ${{ secrets.GID_REVERSED_CLIENT_ID }}
          GID_SERVER_CLIENT_ID: ${{ secrets.GID_SERVER_CLIENT_ID }}
        run: |
          # Hard-fail the misconfiguration that caused #471 (build 14 shipped with no iOS
          # Google client ID) without printing the value itself — the client IDs are
          # registered secrets and masked in logs anyway.
          if [[ -z "${GID_CLIENT_ID}" || -z "${GID_REVERSED_CLIENT_ID}" ]]; then
            echo "::error::GID_CLIENT_ID and GID_REVERSED_CLIENT_ID must both be set for a TestFlight archive — refusing to ship a build with native Google sign-in disabled (see #471)."
            exit 1
          fi

          # The app and the embedded StillPointMonitor and StillPointWidget extensions each
          # sign manually with their own profile, selected per-target via
          # PROVISIONING_PROFILE_SPECIFIER in project.yml; all three profiles were installed
          # in the previous step. We do NOT pass a single global PROVISIONING_PROFILE_SPECIFIER
          # here — that would force the app's profile onto an extension and fail signing
          # (bundle-id mismatch).
          #
          # GID_* are passed as build settings so xcodebuild substitutes them into the
          # Info.plist's $(GID_…) placeholders at build time, overriding project.yml's
          # empty defaults.
          xcodebuild archive \
            -project StillPoint.xcodeproj \
            -scheme StillPoint \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/StillPoint.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=T5UU4BP6AV \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            GID_CLIENT_ID="${GID_CLIENT_ID}" \
            GID_REVERSED_CLIENT_ID="${GID_REVERSED_CLIENT_ID}" \
            GID_SERVER_CLIENT_ID="${GID_SERVER_CLIENT_ID}"

      - name: Upload to App Store Connect
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # Write API key to file for authentication
          mkdir -p ~/.private_keys
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          # Export and upload in one step using xcodebuild
          # The ExportOptions.plist has destination=upload and method=app-store-connect
          # which makes xcodebuild upload directly to App Store Connect / TestFlight
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StillPoint.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Clean up keychain, provisioning profile, and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_pp_ext.mobileprovision" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_pp_widget.mobileprovision" 2>/dev/null || true
          if [[ -n "${PP_UUID:-}" ]]; then
            rm -f ~/Library/MobileDevice/Provisioning\ Profiles/"${PP_UUID}".mobileprovision 2>/dev/null || true
          fi
          if [[ -n "${EXT_PP_UUID:-}" ]]; then
            rm -f ~/Library/MobileDevice/Provisioning\ Profiles/"${EXT_PP_UUID}".mobileprovision 2>/dev/null || true
          fi
          if [[ -n "${WIDGET_PP_UUID:-}" ]]; then
            rm -f ~/Library/MobileDevice/Provisioning\ Profiles/"${WIDGET_PP_UUID}".mobileprovision 2>/dev/null || true
          fi
          rm -rf ~/.private_keys 2>/dev/null || true
