name: Auto TestFlight on merge

# Cut one TestFlight build whenever a merge to main changes iOS app code
# (#707). Nobody applies a label: the `paths` filter below is the gate, so
# web-only and doc-only merges never start a run.
#
# Flow:
#   1. Run mobile-web e2e (e2e-mobile.yml) AND native iOS e2e (e2e-ios.yml) in
#      parallel against the pushed commit (#588 — both gate the release).
#   2. Only if both are green: claim the next build number by pushing an
#      ios-v<MARKETING_VERSION>-build<N> tag on that commit, where N is 1 + the
#      highest ios-v*-build* tag on origin
#      (scripts/ci/ios-testflight-build-number.mjs).
#   3. Call the shared reusable workflow to build + upload that commit with
#      CURRENT_PROJECT_VERSION=N.
#
# Nothing is committed back to main. The tag, not ios/project.yml, carries the
# build number, so a cut never rewrites project.yml under open iOS PRs and never
# adds a commit that makes them BEHIND. (The workflow this replaces pushed a bump
# commit to main, which branch protection rejects, and waited on a release:ios
# label that nothing applied — it never uploaded a build.)
#
# The e2e gate runs BEFORE the tag is claimed (#494): the tag push is itself a
# release side effect, so a failing e2e must prevent it, not just the build.
#
# The tag is pushed with the default GITHUB_TOKEN. GitHub does NOT start new
# workflow runs for GITHUB_TOKEN-authored pushes, so the new ios-v*-build* tag
# does not also trigger ios-testflight.yml — no double build. If this is ever
# switched to a PAT, add a guard so the manual workflow skips bot-cut tags.
#
# `workflow_dispatch` cuts the current main on demand (still e2e-gated), for a
# merge the path filter missed or a cut that needs a fresh number.

on:
  push:
    branches: [main]
    # Everything under ios/ except files that never reach the shipped binary.
    # Order matters: a later pattern overrides an earlier one for the same file.
    # Keep in sync with the cases in scripts/ci/ios-testflight-build-number.test.ts.
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - '!ios/docs/**'
      - '!ios/screenshots/**'
      - '!ios/fastlane/**'
      - '!ios/Gemfile'
      - '!ios/Gemfile.lock'
      - '!ios/ExportOptionsFastlane.plist'
      - '!ios/StillPointAppUITests/**'
      - '!ios/StillPointShared/Tests/**'
      # CI regenerates the Xcode project from ios/project.yml before every build.
      - '!ios/StillPoint.xcodeproj/**'
      # Bundled app resources ship whatever their extension.
      - 'ios/StillPointApp/Resources/**'
  workflow_dispatch:

permissions:
  contents: read

# One cut at a time. A newer iOS merge replaces a queued (not yet running) cut;
# the replacement builds the newer main, which contains the replaced merge. A
# running cut is never cancelled, so a claimed tag always gets its build. The
# manual tag path (ios-testflight.yml) uses its own group so neither path
# cancels the other; the tag push keeps their build numbers apart.
concurrency:
  group: ios-testflight-auto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-mobile:
    name: release e2e (mobile web)
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e-mobile.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  e2e-ios:
    name: release e2e (native iOS)
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e-ios.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  tag:
    name: Claim build number and cut TestFlight tag
    needs: [e2e-mobile, e2e-ios]
    if: >-
      needs.e2e-mobile.result == 'success' &&
      needs.e2e-ios.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.claim.outputs.tag }}
      build_number: ${{ steps.claim.outputs.build_number }}
    steps:
      # Credentials stay persisted: the claim step pushes the tag.
      - name: Checkout pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Claim build number and push tag
        id: claim
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          node scripts/ci/ios-testflight-build-number.mjs claim "$SHA"

  build:
    needs: tag
    uses: ./.github/workflows/ios-testflight-build.yml
    with:
      ref: ${{ github.sha }}
      build_number: ${{ needs.tag.outputs.build_number }}
    secrets: inherit
