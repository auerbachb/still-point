name: iOS App Store release (Fastlane)

# Push a strict semver tag (ios-v1.2.3, equal to MARKETING_VERSION) to build the
# App Store binary with Fastlane and upload it with its metadata.
#
# Flow:
#   1. Two gates run side by side, and build-number needs both:
#      - pre-flight-tests: the release-config UI smoke gate.
#      - release-secrets: scripts/ci/ios-app-store-release-secrets.mjs checks
#        that every secret fastlane-release needs is set, and names any that
#        are missing, so a missing secret fails the run before it costs a
#        build number (#937).
#   2. build-number: check the tag against MARKETING_VERSION and the release-
#      readiness checklists, then claim the next build number the way TestFlight
#      cuts do (#838): push an ios-v<MARKETING_VERSION>-build<N> tag on this
#      commit, where N is 1 + the highest ios-v*-build* tag on origin
#      (scripts/ci/ios-testflight-build-number.mjs). The App Store build gets a
#      fresh N even when TestFlight already cut this commit.
#   3. fastlane-release: dry-run evidence for that build, then
#      `bundle exec fastlane release`, which builds with CURRENT_PROJECT_VERSION=N
#      (IOS_BUILD_NUMBER) and uploads.
#
# No ios/project.yml bump is needed: its CURRENT_PROJECT_VERSION is only the
# local-build default (#707). The cheap gates run before the claim because the
# tag push is itself a release side effect (#494).
#
# The tag is pushed with the default GITHUB_TOKEN, and GitHub starts no workflow
# runs for GITHUB_TOKEN pushes, so the new ios-v*-build* tag does not also
# trigger ios-testflight.yml.
#
# Re-running only the failed jobs keeps the claimed number: build-number's
# outputs carry over. A run that fails after the claim leaves its tag behind,
# and the next cut takes the number after it; App Store Connect accepts the gap.

on:
  push:
    tags:
      # Strict semver: ios-v1.2.3 (no -build suffix — those stay on TestFlight workflow).
      - 'ios-v*.*.*'
      - '!ios-v*-build*'

permissions:
  contents: read

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  pre-flight-tests:
    name: Release-config UI smoke gate
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen and generate Xcode project
        uses: ./.github/actions/ios-xcodegen

      - name: Run iOS smoke lane in Release configuration
        env:
          E2E_ENV: ci
          E2E_SECRETS_REQUIRED: "false"
          IOS_TEST_CONFIGURATION: "Release"
        run: npm run e2e:ios:smoke

      - name: Upload simulator diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app-store-release-preflight-diagreports
          path: ~/Library/Logs/DiagnosticReports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app-store-release-preflight-xcresult
          path: artifacts/e2e/ios/**
          if-no-files-found: warn
          retention-days: 14

  release-secrets:
    name: Check release secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only. The secrets reach only the check step, and the job installs no
    # packages, so no npm code runs on a runner that holds them.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # Prints the name of each missing secret, never a value. Bind the same
      # list as the script's REQUIRED_SECRETS.
      - name: Check every secret fastlane-release needs is set
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_EXTENSION_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_EXTENSION_BASE64 }}
          BUILD_PROVISION_PROFILE_WIDGET_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_WIDGET_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          GID_CLIENT_ID: ${{ secrets.GID_CLIENT_ID }}
          GID_REVERSED_CLIENT_ID: ${{ secrets.GID_REVERSED_CLIENT_ID }}
        run: node scripts/ci/ios-app-store-release-secrets.mjs

  build-number:
    name: Claim build number
    needs: [pre-flight-tests, release-secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write: it pushes the build tag. It gets no secrets:
    # release-secrets checks them, and fastlane-release signs and uploads with
    # them, both with a read-only token.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.claim.outputs.tag }}
      build_number: ${{ steps.claim.outputs.build_number }}

    steps:
      # Credentials stay persisted: the claim step pushes the tag.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate tag matches ios project marketing version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^ios-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be ios-vMAJOR.MINOR.PATCH (got $TAG)"
            exit 1
          fi
          VER="${TAG#ios-v}"
          MARKETING="$(grep -E '^[[:space:]]+MARKETING_VERSION:' ios/project.yml | head -1 | sed -E 's/.*MARKETING_VERSION:[[:space:]]*"?([^"#]+)"?.*/\1/' | xargs)"
          if [[ "$VER" != "$MARKETING" ]]; then
            echo "::error::Tag version $VER does not match ios/project.yml MARKETING_VERSION=$MARKETING"
            exit 1
          fi

      - name: Validate release-readiness artifacts
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f ios/PARITY_CHECKLIST.md; then
            echo "::error::Missing ios/PARITY_CHECKLIST.md"
            exit 1
          fi
          if ! test -f ios/QA_CHECKLIST.md; then
            echo "::error::Missing ios/QA_CHECKLIST.md"
            exit 1
          fi
          if ! grep -qE '^- \[[xX]\] Feature parity checklist between iOS and web is completed\.$' ios/PARITY_CHECKLIST.md; then
            echo "::error::Missing PARITY_CHECKLIST entry: Feature parity checklist between iOS and web is completed"
            exit 1
          fi
          if ! grep -qE '^- \[[xX]\] All critical parity gaps are fixed or explicitly deferred with owner/date\.$' ios/PARITY_CHECKLIST.md; then
            echo "::error::Missing PARITY_CHECKLIST entry: All critical parity gaps are fixed or explicitly deferred with owner/date"
            exit 1
          fi
          if ! grep -qE '^- \[[xX]\] Regression/QA pass for release candidate is completed\.$' ios/QA_CHECKLIST.md; then
            echo "::error::Missing QA_CHECKLIST entry: Regression/QA pass for release candidate is completed"
            exit 1
          fi
          if ! grep -qE '^- \[[xX]\] App Store metadata/versioning/release notes are finalized\.$' ios/QA_CHECKLIST.md; then
            echo "::error::Missing QA_CHECKLIST entry: App Store metadata/versioning/release notes are finalized"
            exit 1
          fi

      - name: Claim build number and push tag
        id: claim
        env:
          SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          node scripts/ci/ios-testflight-build-number.mjs claim "$SHA" --cut "App Store release $RELEASE_TAG"

  fastlane-release:
    name: Build and upload with Fastlane
    needs: build-number
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Generate App Store submission dry-run evidence
        env:
          # The evidence names the build this run ships, not the latest TestFlight cut.
          INTENDED_TAG: ${{ needs.build-number.outputs.tag }}
        run: npm run ios:app-store:dry-run -- --release-owner "${{ github.actor }}" --intended-tag "$INTENDED_TAG"

      - name: Upload App Store submission dry-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app-store-dry-run-release
          path: artifacts/ios-app-store-dry-run/**
          if-no-files-found: error
          retention-days: 30

      - name: Verify Xcode and iOS SDK versions
        shell: bash
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: ${SDK_VERSION}"
          [[ "${SDK_VERSION%%.*}" -ge 26 ]]

      - name: Install XcodeGen and generate Xcode project
        uses: ./.github/actions/ios-xcodegen

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install Apple certificate and provisioning profiles
        uses: ./.github/actions/ios-signing-install
        with:
          build-certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          provision-profile-base64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          provision-profile-extension-base64: ${{ secrets.BUILD_PROVISION_PROFILE_EXTENSION_BASE64 }}
          provision-profile-widget-base64: ${{ secrets.BUILD_PROVISION_PROFILE_WIDGET_BASE64 }}

      - name: Fastlane release (gym, deliver)
        working-directory: ios
        env:
          # Map the APPSTORE_* secrets to Fastlane's standard env (spaceship / deliver).
          # The Fastfile reads these first and falls back to the APPSTORE_* names
          # only when they are unset, so the secrets are bound once, here.
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # Native Google Sign-In client IDs (#344 / #471). The Fastfile `build` lane
          # feeds these into gym's xcargs so the App Store IPA also ships a working iOS
          # Google client ID + reversed-client-ID URL scheme. Empty/unset → no-op.
          GID_CLIENT_ID: ${{ secrets.GID_CLIENT_ID }}
          GID_REVERSED_CLIENT_ID: ${{ secrets.GID_REVERSED_CLIENT_ID }}
          GID_SERVER_CLIENT_ID: ${{ secrets.GID_SERVER_CLIENT_ID }}
          # CFBundleVersion for the app and both extensions: the N that build-number
          # claimed (#838). The Fastfile `build` lane passes it to gym as
          # CURRENT_PROJECT_VERSION, so project.yml's stale default never ships.
          IOS_BUILD_NUMBER: ${{ needs.build-number.outputs.build_number }}
          # The release lane's preflight is the dry run the evidence step above already
          # ran for this build (with --intended-tag), so skip it here. RELEASE_OWNER
          # only reaches that preflight; it stays set for a run with SKIP_PREFLIGHT unset.
          RELEASE_OWNER: ${{ github.actor }}
          SKIP_PREFLIGHT: "1"
          # Harness default: upload binary + metadata only — omit SUBMIT_FOR_REVIEW (deliver uses submit_for_review: false).
          # Issue #296+: set SUBMIT_FOR_REVIEW=1 (and optionally AUTOMATIC_RELEASE=1) when a release owner approves submission.
        run: |
          # An App Store production build MUST ship native Google sign-in configured — a
          # build with these unset would recreate #471 (build 14 shipped with Google off).
          # Hard-fail here rather than deliver a broken binary to users (mirrors the
          # TestFlight archive gate). GID_* are already in this step's env above.
          if [[ -z "${GID_CLIENT_ID}" || -z "${GID_REVERSED_CLIENT_ID}" ]]; then
            echo "::error::GID_CLIENT_ID and GID_REVERSED_CLIENT_ID must both be set for an App Store release — refusing to ship a build with native Google sign-in disabled (see #471)."
            exit 1
          fi
          # Unset, gym would build with project.yml's CURRENT_PROJECT_VERSION, a number
          # TestFlight already used (#838).
          if [[ ! "${IOS_BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::IOS_BUILD_NUMBER must be the positive integer that build-number claimed (got '${IOS_BUILD_NUMBER}')."
            exit 1
          fi
          bundle exec fastlane release

      # The App Store lane never writes ~/.private_keys (the Fastfile passes the
      # API key to Fastlane as key_content), so it leaves remove-private-keys off.
      - name: Clean up keychain and provisioning profiles
        if: always()
        uses: ./.github/actions/ios-signing-cleanup
