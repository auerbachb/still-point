name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run diagnostic-service unit tests
        run: |
          npm ci --prefix services/diagnostic-service
          npm run test:diagnostic-service

  # Full-project type gate. `next build` only typechecks app code, so test-only
  # type errors (bad mock signatures, NODE_ENV assignment, etc.) used to land on
  # main undetected (#396). `tsc --noEmit` honors tsconfig's `include`
  # (**/*.ts, **/*.tsx), so *.test.ts files are typechecked too. Runs in parallel
  # with unit-tests as its own required-able check.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, includes test files)
        run: npm run typecheck
